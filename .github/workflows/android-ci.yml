name: Android CI

on:
  push:
    branches: [ "main", "master", "develop", "copilot/**" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: hijacker-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
        
  build-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Sign Release APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"
      continue-on-error: true
      
    - name: Upload Release APK (Unsigned)
      uses: actions/upload-artifact@v4
      if: steps.sign_app.outcome == 'failure'
      with:
        name: hijacker-release-apk-unsigned
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
        
    - name: Upload Release APK (Signed)
      uses: actions/upload-artifact@v4
      if: steps.sign_app.outcome == 'success'
      with:
        name: hijacker-release-apk-signed
        path: ${{steps.sign_app.outputs.signedReleaseFile}}
        retention-days: 90
