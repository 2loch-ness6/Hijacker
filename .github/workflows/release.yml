name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.0-android14)'
        required: true
        default: 'v2.0-test'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      
    - name: Sign Release APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"
      continue-on-error: true
      
    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi
        
    - name: Rename APKs
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        mkdir -p release-apks
        if [ -f "${{steps.sign_app.outputs.signedReleaseFile}}" ]; then
          cp "${{steps.sign_app.outputs.signedReleaseFile}}" "release-apks/Hijacker-${VERSION}-release-signed.apk"
        fi
        cp app/build/outputs/apk/release/app-release-unsigned.apk "release-apks/Hijacker-${VERSION}-release-unsigned.apk" 2>/dev/null || true
        cp app/build/outputs/apk/debug/app-debug.apk "release-apks/Hijacker-${VERSION}-debug.apk"
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      with:
        name: Hijacker ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## Hijacker ${{ steps.get_version.outputs.VERSION }}
          
          ### Android 14 Modernization Release
          
          This version has been modernized for Android 14 with:
          - Target SDK 34 (Android 14)
          - Modern AndroidX libraries
          - Updated build system (Gradle 8.5, AGP 8.2.2)
          - Enhanced permissions for Android 13+
          - Optimized for ARM64 devices
          - Support for modern Qualcomm chipsets with OxygenOS 14
          
          ### Installation
          1. Download the appropriate APK for your device
          2. Enable installation from unknown sources
          3. Install the APK
          4. Grant necessary permissions when prompted
          
          ### Requirements
          - Android 8.0+ (API 26+)
          - ARM64 device (2023-24 flagship recommended)
          - Root access
          - WiFi adapter with monitor mode support (or NetHunter)
          
          ### Notes
          - **Release-signed**: Signed release build (recommended)
          - **Release-unsigned**: Unsigned release build
          - **Debug**: Debug build with additional logging
          
        files: |
          release-apks/*.apk
        draft: false
        prerelease: false
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hijacker-release-${{ steps.get_version.outputs.VERSION }}
        path: release-apks/*.apk
        retention-days: 90
